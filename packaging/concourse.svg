<?xml version="1.0" encoding="UTF-8"?>
<!-- Concourse — the station's shared hall. Sharp corners, carved stone
     portal, a departures board glowing inside. Blossom Dark tokens. -->
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- plane -->
  <rect x="0" y="0" width="256" height="256" fill="#1c1016"/>
  <rect x="6" y="6" width="244" height="244" fill="none" stroke="#553948" stroke-width="2"/>

  <!-- floor -->
  <rect x="20" y="206" width="216" height="10" fill="#3b2631"/>
  <rect x="20" y="206" width="216" height="2" fill="#553948"/>
  <rect x="20" y="214" width="216" height="2" fill="#1d1117"/>

  <!-- left column (carved: light top/left, shadow bottom/right) -->
  <rect x="44" y="92" width="26" height="114" fill="#3b2631"/>
  <rect x="44" y="92" width="2" height="114" fill="#553948"/>
  <rect x="44" y="92" width="26" height="2" fill="#553948"/>
  <rect x="68" y="92" width="2" height="114" fill="#1d1117"/>
  <rect x="40" y="84" width="34" height="8" fill="#3b2631"/>
  <rect x="40" y="84" width="34" height="2" fill="#553948"/>

  <!-- right column -->
  <rect x="186" y="92" width="26" height="114" fill="#3b2631"/>
  <rect x="186" y="92" width="2" height="114" fill="#553948"/>
  <rect x="186" y="92" width="26" height="2" fill="#553948"/>
  <rect x="210" y="92" width="2" height="114" fill="#1d1117"/>
  <rect x="182" y="84" width="34" height="8" fill="#3b2631"/>
  <rect x="182" y="84" width="34" height="2" fill="#553948"/>

  <!-- lintel -->
  <rect x="32" y="58" width="192" height="26" fill="#3b2631"/>
  <rect x="32" y="58" width="192" height="3" fill="#553948"/>
  <rect x="32" y="81" width="192" height="3" fill="#1d1117"/>
  <!-- the accent keystone -->
  <rect x="122" y="64" width="12" height="12" fill="#ec8fac" transform="rotate(45 128 70)"/>

  <!-- departures board hanging in the portal -->
  <rect x="86" y="104" width="84" height="6" fill="#1d1117"/>
  <rect x="92" y="110" width="72" height="58" fill="#120a0e"/>
  <rect x="92" y="110" width="72" height="58" fill="none" stroke="#553948" stroke-width="2"/>
  <!-- three board rows: lamp + flip-cells -->
  <rect x="98" y="118" width="8" height="8" fill="#87d787"/>
  <rect x="110" y="118" width="22" height="8" fill="#33212c"/>
  <rect x="136" y="118" width="12" height="8" fill="#33212c"/>
  <rect x="152" y="118" width="6" height="8" fill="#33212c"/>

  <rect x="98" y="134" width="8" height="8" fill="#ffaf00"/>
  <rect x="110" y="134" width="14" height="8" fill="#33212c"/>
  <rect x="128" y="134" width="24" height="8" fill="#33212c"/>

  <rect x="98" y="150" width="8" height="8" fill="#ec8fac"/>
  <rect x="110" y="150" width="30" height="8" fill="#33212c"/>
  <rect x="144" y="150" width="10" height="8" fill="#33212c"/>
</svg>
